[package]
name = "battery-viz"
version = "0.1.0"
edition = "2021"
description = "Low-latency battery optimization visualizer for macOS and Windows"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui_plot = "0.29"
serde = { version = "1", features = ["derive"] }
plist = "1"
crossbeam-channel = "0.5"
dirs = "5"

[target.'cfg(windows)'.dependencies]
wmi = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
