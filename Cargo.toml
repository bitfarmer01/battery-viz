[package]
name = "battery-viz"
version = "0.1.0"
edition = "2021"
description = "Low-latency battery optimization visualizer for macOS and Windows"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui_plot = "0.29"
serde = { version = "1", features = ["derive"] }
plist = "1"
crossbeam-channel = "0.5"
dirs = "5"

[target.'cfg(windows)'.dependencies]
wmi = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
# Menu-bar tray (show dashboard / pause alerts / quit).
tray-icon = "0.19"
# Same event-loop crate eframe already vendors; pinned to the version eframe
# uses with eframe's feature set (defaults off — the defaults would pull
# extra Wayland decoration crates into non-macOS unified builds). Needed
# only for the Accessory activation policy (LSUIElement agent mode).
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }

[profile.release]
# Size-optimized release build (spec: binary-size budget).
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
